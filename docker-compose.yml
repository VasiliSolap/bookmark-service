services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: bookmarks
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bookmarks"]
      interval: 2s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/bookmarks
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
